name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs these; the default GITHUB_TOKEN permissions are not enough.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue instead, and don't cancel one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Tests gate the deploy. The prediction engine decides when this app
      # tells someone they can skip a condom; it does not ship unverified.
      - run: npm test

      - run: npm run build
        env:
          # A project site is served from /<repo>/, and this must match it
          # exactly or the deployed app loads a blank page.
          VITE_BASE_PATH: /cycle/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      # GitHub Pages has no SPA fallback, so a refresh on any path 404s.
      # Serving index.html as the 404 page is the standard remedy.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
